
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: apisix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /usr/share/nginx/html/app1
              echo "Hello from Application 1" > /usr/share/nginx/html/app1/index.html
              exec nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: apisix
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 80
---
