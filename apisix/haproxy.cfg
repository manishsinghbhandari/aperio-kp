global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:8080
    mode http
    default_backend apisix_backend

backend apisix_backend
    mode http
    balance roundrobin
    server apisix apisix-gateway.apisix.svc.cluster.local:80 check
